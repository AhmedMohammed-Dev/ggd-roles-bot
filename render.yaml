# ملف نشر Render (Blueprint) — تنسيقه حسب المرجع الرسمي:
# https://render.com/docs/blueprint-spec
# مفاتيح الجذر المسموح بها هي: services / databases / envVarGroups / projects / ungrouped فقط.

services:
  - type: web
    name: ggd-roles-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -u bot.py
    healthCheckPath: /healthz
    # النشر التلقائي عند كل حفظة (push) على الفرع main — حتى تصل أي إضافة في الأدوار
    # إلى البوت الحي بلا أي خطوات يدوية. القيم المسموحة من Render: commit / off / checksPass
    # ⚠️ علامتا التنصيص مهمتان: YAML يفهم commit بلا تنصيص ككلمة عادية لكن بقية القيم
    #    (مثل off) تُقرأ كقيمة منطقية، لذا نكتبها دائماً كنصّ صريح لتفادي أي التباس.
    autoDeployTrigger: "commit"
    envVars:
      # ⬇️ الحقل الوحيد المطلوب منك: توكن البوت (يُكتب سرّاً في لوحة Render، ولا يُحفظ في الملف)
      - key: DISCORD_TOKEN
        sync: false

      # ⬇️ الباقي مضبوط مسبقاً — لا تحتاج كتابة أي شيء.
      # سيرفرك أنت (معرّف السيرفر ليس سرّاً — يظهر في كل روابط ديسكورد).
      - key: GUILD_ID
        value: "1546676344967012383"
      # قفل أمني: البوت يعمل في هذا السيرفر فقط ويخرج تلقائياً من أي سيرفر آخر.
      - key: ALLOWED_GUILD_IDS
        value: "1546676344967012383"

      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ENABLE_PREFIX_COMMANDS
        value: "false"
      - key: ACTION_COOLDOWN_SECONDS
        value: "1"
      - key: SELF_PING_SECONDS
        value: "600"

    # ملاحظة: لا حاجة لـ PUBLIC_URL — البوت يقرأ الرابط من RENDER_EXTERNAL_URL الذي تضبطه
    # Render تلقائياً، فيكون صحيحاً دائماً حتى لو تغيّر اسم النطاق الفرعي.
