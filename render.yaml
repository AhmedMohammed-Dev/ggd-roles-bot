# ملف نشر Render (Blueprint) — تنسيقه حسب المرجع الرسمي:
# https://render.com/docs/blueprint-spec
# مفاتيح الجذر المسموح بها هي: services / databases / envVarGroups / projects / ungrouped فقط.

services:
  - type: web
    name: ggd-roles-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -u bot.py
    healthCheckPath: /healthz
    # autoDeploy مهجور الآن — البديل الرسمي هو autoDeployTrigger
    autoDeployTrigger: commit
    envVars:
      # ⬇️ هذه القيم تُدخل سرّاً في لوحة Render (sync: false = لا تُحفظ في الملف)
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      # قائمة بيضاء: البوت يعمل في هذه السيرفرات فقط ويخرج من غيرها
      - key: ALLOWED_GUILD_IDS
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: HEALTH_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ENABLE_PREFIX_COMMANDS
        value: "false"
      - key: ACTION_COOLDOWN_SECONDS
        value: "1"
      - key: SELF_PING_SECONDS
        value: "600"
